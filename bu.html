<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ฟอร์มเข้าสู่ระบบ</title>
</head>
<body>
    <h2>ฟอร์มเข้าสู่ระบบ</h2>
    <form id="loginForm">
        <label for="username">ชื่อผู้ใช้:</label>
        <input type="text" id="username" name="Username" required>

        <label for="password">รหัสผ่าน:</label>
        <input type="password" id="password" name="Password" required>

        <button type="submit">เข้าสู่ระบบ</button>
    </form>

    <div id="responseMessage"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // ป้องกันการส่งฟอร์มแบบปกติ

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const formData = new URLSearchParams();
            formData.append('Username', username);
            formData.append('Password', password);

            fetch('https://assessment.bu.ac.th/App_AJAX/Login/CheckLogin.aspx', {
                method: 'POST',
                body: formData,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(response => response.text())
            .then(data => {
                console.log('Server Response:', data);

                const responseMessage = document.getElementById('responseMessage');
                if (data.includes('studentOK')) {
                    responseMessage.style.color = 'green';
                    responseMessage.textContent = 'เข้าสู่ระบบสำเร็จ!';
                } else {
                    responseMessage.style.color = 'red';
                    responseMessage.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบข้อมูลของคุณ';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const responseMessage = document.getElementById('responseMessage');
                responseMessage.style.color = 'red';
                responseMessage.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
            });
        });
    </script>
</body>
</html>
