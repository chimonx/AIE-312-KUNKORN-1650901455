<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form Using GET</title>
    <style>
        /* Simple styling for the form */
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        form {
            max-width: 300px;
            margin: auto;
        }
        label, input {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
        }
        #responseMessage {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Login Form Using GET</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="Username" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="Password" required>

        <button type="submit">Login</button>
    </form>

    <div id="responseMessage"></div>

    <script>
        // Wait for the DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            // Get the form element
            const form = document.getElementById('loginForm');

            // Add an event listener for the form submission
            form.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent the default form submission

                // Get the input values
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Build the URL with query parameters
                const url = 'https://assessment.bu.ac.th/App_AJAX/Login/CheckLogin.aspx?' +
                    'Username=' + encodeURIComponent(username) +
                    '&Password=' + encodeURIComponent(password);

                // Send data to the server using Fetch API
                fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                })
                .then(response => response.text())
                .then(data => {
                    // Handle the response from the server
                    console.log('Server Response:', data);

                    // Display the response on the page
                    const responseMessage = document.getElementById('responseMessage');
                    if (data.includes('studentOK')) {
                        responseMessage.style.color = 'green';
                        responseMessage.textContent = 'เข้าสู่ระบบสำเร็จ!';
                    } else {
                        responseMessage.style.color = 'red';
                        responseMessage.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบข้อมูลของคุณ';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const responseMessage = document.getElementById('responseMessage');
                    responseMessage.style.color = 'red';
                    responseMessage.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
                });
            });
        });
    </script>
</body>
</html>
