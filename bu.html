<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Login">
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // ใช้ CORS proxy เพื่อข้ามปัญหาการบล็อก CORS
            var proxyUrl = 'https://cors-anywhere.herokuapp.com/';
            var targetUrl = 'https://assessment.bu.ac.th/App_AJAX/Login/CheckLogin.aspx?Username=' + encodeURIComponent(username) + '&Password=' + encodeURIComponent(password);

            fetch(proxyUrl + targetUrl)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').innerText = data.includes('studentOK') ? 'Login Successful' : 'Login Failed';
                })
                .catch(error => {
                    document.getElementById('result').innerText = 'Error: ' + error;
                });
        });
    </script>
</body>
</html>
